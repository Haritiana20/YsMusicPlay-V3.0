
name: Build Ys Music Play V6.2.0

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Android APK ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate or extract source project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=""
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if [ -f "$d/app/build.gradle.kts" ]; then PROJECT="$d"; break; fi
          done < <(find . -type f -name settings.gradle.kts -not -path './.git/*')

          if [ -z "$PROJECT" ]; then
            ZIP_FILE="$(find . -maxdepth 5 -type f -iname '*.zip' | head -n 1 || true)"
            if [ -z "$ZIP_FILE" ]; then
              echo "No Gradle source or source ZIP found in repository."
              find . -maxdepth 3 -type f -print
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/ysmusic-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/ysmusic-source"
            while IFS= read -r f; do
              d="$(dirname "$f")"
              if [ -f "$d/app/build.gradle.kts" ]; then PROJECT="$d"; break; fi
            done < <(find "$RUNNER_TEMP/ysmusic-source" -type f -name settings.gradle.kts)
          fi

          if [ -z "$PROJECT" ]; then
            echo "Gradle project root not found."
            exit 1
          fi
          echo "Using project root: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Fetch Demucs Android engine
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p third_party
          if [ ! -d third_party/demucs-android/.git ]; then
            git clone --depth 1 --recurse-submodules \
              https://github.com/jPaauwe/demucs-android \
              third_party/demucs-android
          fi
          test -f third_party/demucs-android/CMakeLists.txt

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          echo "APK created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YsMusicPlay-V6.2.0-ARM64
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
